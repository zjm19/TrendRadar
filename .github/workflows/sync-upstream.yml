name: Sync Upstream (每两月同步)

on:
  schedule:
    # 每两个月的2号凌晨4点执行（避开1号高峰）
    - cron: "0 4 2 */2 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'

      - name: Add upstream and fetch updates
        run: |
          git remote add upstream https://github.com/sansan0/TrendRadar.git || true
          git fetch upstream

      - name: Check for upstream changes
        run: |
          if git diff --quiet HEAD upstream/main; then
            echo "✅ 上游无新提交，无需同步"
            exit 0
          fi
          echo "🔄 检测到上游更新，开始合并"

      - name: Merge upstream changes (protect your custom configs)
        run: |
          git checkout main
          mkdir -p config

          # 备份自定义配置（仅当文件存在时）
          [ -f config/frequency_words.txt ] && cp config/frequency_words.txt /tmp/my_words.txt
          [ -f config/config.yaml ] && cp config/config.yaml /tmp/my_config.yaml

          # 尝试合并上游更新（优先采用上游代码解决冲突）
          git merge upstream/main --strategy-option=theirs -m "Sync upstream $(date +%Y-%m)" || {
            echo "⚠️ 合并出现冲突，尝试重置后重新合并..."
            git reset --hard HEAD
            git merge upstream/main -X theirs -m "Sync upstream $(date +%Y-%m)"
          }

          # 恢复您的自定义配置（覆盖上游默认配置，仅当备份存在时）
          if [ -f /tmp/my_words.txt ]; then
            mv /tmp/my_words.txt config/frequency_words.txt
            echo "✅ 已恢复 frequency_words.txt"
          else
            echo "ℹ️ frequency_words.txt 原本不存在，已使用上游默认版本"
          fi

          if [ -f /tmp/my_config.yaml ]; then
            mv /tmp/my_config.yaml config/config.yaml
            echo "✅ 已恢复 config.yaml"
          else
            echo "ℹ️ config.yaml 原本不存在，已使用上游默认版本"
          fi

          # 提交所有更改（配置目录和合并结果）
          git add config/
          git commit -m "Sync upstream $(date +%Y-%m) - keep custom configs" 2>/dev/null || echo "ℹ️ 无新增配置变更"

      - name: Push to your repository
        run: |
          # 仅当有本地新提交时才推送
          if [ $(git rev-list HEAD...origin/main --count) -ne 0 ]; then
            git push origin main
            echo "✅ 同步完成：已合并上游更新并保留您的配置"
          else
            echo "ℹ️ 无本地新提交，跳过推送"
          fi
